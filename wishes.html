<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Wishes | ForYou</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navigation -->
  <header class="navbar">

    <div class="logo">ForYou</div>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="letters.html">Letters</a>
      <a href="wishes.html" class="active">For Us, Someday</a>
      <a href="smile.html">Need a Smile?</a>
    </nav>

  </header>


  <!-- Background -->
  <div class="bg-circle circle-1"></div>
  <div class="bg-circle circle-2"></div>


  <!-- Main Content -->
  <main class="container">

    <h1>Our Wishes</h1>

    <h2 class="message-title">
      A little time capsule for us 💜
    </h2>

    <p>
      Write something you wish for us now...
      <br>
      We'll come back here and read them together when we meet.
    </p>


    <!-- Wish Writing Area -->
    <div class="content-card">

      <h2 class="section-title">
        Write a Wish ✨
      </h2>

      <textarea
        id="wishInput"
        placeholder="Write anything you wish for us..."
        rows="6"
      ></textarea>

      <br>

      <button id="saveWishBtn" class="enter-btn">
        Seal This Wish 💌
      </button>

    </div>


    <!-- Time Capsule -->
    <div class="content-card">

      <h2 class="section-title">
        Our Sealed Wishes 🔐
      </h2>

      <p id="capsuleMessage">
        Your wishes are waiting here for the day we meet.
      </p>

      <button id="openCapsuleBtn" class="enter-btn">
        Open Our Time Capsule 💜
      </button>

      <div id="wishesContainer"></div>

    </div>


    <!-- Continue -->
    <a href="final.html" class="enter-btn">
      Continue →
    </a>

  </main>


  <script>
    const wishInput = document.getElementById("wishInput");
    const saveWishBtn = document.getElementById("saveWishBtn");
    const openCapsuleBtn = document.getElementById("openCapsuleBtn");
    const wishesContainer = document.getElementById("wishesContainer");
    const capsuleMessage = document.getElementById("capsuleMessage");

    let wishes = JSON.parse(localStorage.getItem("forYouWishes")) || [];

    let capsuleOpened = false;


    // Save a new wish
    saveWishBtn.addEventListener("click", () => {

      const wish = wishInput.value.trim();

      if (wish === "") {
        alert("Write a little wish first. 💜");
        return;
      }

      wishes.push({
        text: wish,
        date: new Date().toLocaleDateString()
      });

      localStorage.setItem("forYouWishes", JSON.stringify(wishes));

      wishInput.value = "";

      capsuleMessage.textContent =
        "Your wish has been sealed safely for us. 💌";

      saveWishBtn.textContent = "Wish Sealed ❤️";

      setTimeout(() => {
        saveWishBtn.textContent = "Seal This Wish 💌";
      }, 1800);
    });


    // Open the time capsule
    openCapsuleBtn.addEventListener("click", () => {

      if (wishes.length === 0) {
        capsuleMessage.textContent =
          "There are no wishes in our time capsule yet. Write one first. 💜";
        return;
      }

      capsuleOpened = !capsuleOpened;

      if (capsuleOpened) {

        wishesContainer.innerHTML = "";

        wishes.forEach((wish, index) => {

          const wishCard = document.createElement("div");

          wishCard.className = "content-card";

          wishCard.innerHTML = `
            <h2 class="message-title">
              Wish ${index + 1} 💌
            </h2>

            <p>
              ${escapeHTML(wish.text)}
            </p>

            <small>
              Written on ${wish.date}
            </small>
          `;

          wishesContainer.appendChild(wishCard);
        });

        capsuleMessage.textContent =
          "Here are the wishes we left for each other. Read them together. 💜";

        openCapsuleBtn.textContent =
          "Close Our Time Capsule";
      }

      else {

        wishesContainer.innerHTML = "";

        capsuleMessage.textContent =
          "Your wishes are sealed again until we're ready to read them.";

        openCapsuleBtn.textContent =
          "Open Our Time Capsule 💜";
      }
    });


    // Prevent HTML from being inserted into the wish
    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
